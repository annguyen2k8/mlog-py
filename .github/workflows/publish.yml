name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦 and verify artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine check-wheel-contents

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata with twine
        run: python -m twine check --strict dist/*

      - name: Verify wheel file contents
        run: check-wheel-contents dist/*.whl

      - name: Smoke test installed wheel
        run: |
          python -m venv test_env
          source test_env/bin/activate
          pip install dist/*.whl
          (cd /tmp && mlog --help)
          (cd /tmp && mlog-py --help)
          (cd /tmp && python -c "import mlog; print('mlog version:', mlog.__version__)")
          (cd /tmp && python -c "from mlog import Vars; print('Vars.tick:', Vars.tick)")
          (cd /tmp && python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('src') else 0)")
          deactivate

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  publish-to-pypi:
    name: Publish distribution 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mlog-py
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
